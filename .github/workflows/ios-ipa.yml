name: Build iPhone app (unsigned .ipa)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [iOS/**, Shared/**, project.yml, .github/workflows/ios-ipa.yml]
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Build without signing
        run: |
          xcodebuild -project GooglyEyes.xcodeproj -scheme GooglyEyes \
            -configuration Release -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" build
      - name: Package .ipa
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Bluey.app Payload/
          zip -r Bluey.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Bluey-ipa
          path: Bluey.ipa
